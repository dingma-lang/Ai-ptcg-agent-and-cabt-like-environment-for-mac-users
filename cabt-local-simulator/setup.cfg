[metadata]
name = cabt-local-simulator
version = 0.1.0
description = Local wrappers for the official cabt Pokemon TCG engine.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cabt-local = cabt_local.cli:main
    cabt-local-app = cabt_local.webapp:main
