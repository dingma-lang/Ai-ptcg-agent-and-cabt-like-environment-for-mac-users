[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cabt-local-simulator"
version = "0.1.0"
description = "Local wrappers for the official cabt Pokemon TCG engine."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
test = []

[project.scripts]
cabt-local = "cabt_local.cli:main"
cabt-local-app = "cabt_local.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]
